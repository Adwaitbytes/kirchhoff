name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - name: Build contracts (integration tests deploy them onto Anvil)
        working-directory: contracts
        run: npm ci && forge build
      - name: No AI in the veto path (PRD section 11)
        run: bash scripts/no-ai-in-veto-path.sh
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r --workspace-concurrency=2 test
      - name: Engine coverage gate (100% branches)
        run: pnpm --filter @kirchhoff/engine coverage

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
